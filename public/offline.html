<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline — Marley Moves</title>
    <style>
      /* Self-contained: this page is shown precisely when the network (and so
         every external stylesheet) is unavailable. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f6f5f3;
        color: #1f1d1b;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #eae7e2;
        border-radius: 14px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      }
      .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
      .brand span { color: #c03838; }
      .dot {
        display: inline-block;
        width: 9px; height: 9px; border-radius: 50%;
        background: #b45309; margin-right: 7px; vertical-align: middle;
      }
      .pill {
        display: inline-flex; align-items: center;
        margin: 18px 0 10px;
        padding: 7px 14px; border-radius: 999px;
        background: #fef3e2; color: #b45309;
        font-size: 13px; font-weight: 700;
      }
      h1 { font-size: 22px; margin: 6px 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #6f6a64; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #c03838; color: #fff;
        font-size: 15px; font-weight: 700;
        padding: 13px 22px; border-radius: 10px; width: 100%;
      }
      a.call { display: block; margin-top: 16px; font-size: 13px; color: #6f6a64; }
      a.call b { color: #1f1d1b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">Marley <span>Moves</span></div>
      <div class="pill"><span class="dot"></span>You're offline</div>
      <h1>No signal right now</h1>
      <p>
        We couldn't reach the server, and this job hasn't been saved to your phone yet.
        Once you're back in signal it'll load straight away.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a class="call" href="tel:01747637070">Need it now? Call the office on <b>01747 637070</b></a>
    </div>
  </body>
</html>
