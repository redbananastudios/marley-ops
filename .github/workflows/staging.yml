name: CI + Deploy to Staging

# Push to `staging` → test gate on a GitHub runner, then build + restart the
# staging container on the self-hosted OVH runner, then run the Playwright e2e
# suite against the LIVE staging deployment. The `e2e` job is the required check
# that gates promotion of this commit to `master` (prod).
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Why this exists: `paths-ignore` at the workflow level meant a docs-only
  # commit produced NO `e2e` check at all — and `e2e` is the required check
  # gating promotion to master. Every promotion whose tip was a docs commit
  # therefore had to bypass branch protection (seen 2026-08-23). A SKIPPED job
  # still reports the context and satisfies the requirement, so the filtering
  # moves from the workflow to the jobs.
  #
  # The detection fails toward RUNNING. Skipping is only allowed when the diff
  # was read successfully, is non-empty, and EVERY path in it is a doc. An
  # unreadable diff, an empty diff, or one unrecognised path runs the full
  # suite. A wrongly-skipped code commit could be promoted unvalidated, so the
  # bias has to point this way.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "no readable base commit -> running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --name-only "$before" "${{ github.sha }}"); then
            echo "diff failed -> running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$files" ]; then
            echo "empty diff -> running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; echo "$files"
          # Anything that is not *.md and not under docs/ forces a full run.
          if echo "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "non-doc file present -> running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only commit -> skipping build/deploy/e2e"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # timeout-minutes on every job: without it a hung step holds the
    # deploy-staging concurrency group for GitHub's 6-hour default (observed
    # 2026-08-19: `playwright install` stalled 3.5h+ and the e2e gate never
    # reported on the deployed commit).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  deploy-staging:
    needs: [changes, test]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: [self-hosted, ovh]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build staging image (NEXT_PUBLIC_* from staging app.env)
        run: |
          set -euo pipefail
          sudo docker tag marley-ops-staging:latest marley-ops-staging:prev 2>/dev/null || true
          URL=$(sudo grep '^NEXT_PUBLIC_SUPABASE_URL=' /opt/marley-ops-staging/app.env | cut -d= -f2-)
          ANON=$(sudo grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' /opt/marley-ops-staging/app.env | cut -d= -f2-)
          APP=$(sudo grep '^NEXT_PUBLIC_APP_URL=' /opt/marley-ops-staging/app.env | cut -d= -f2-)
          sudo docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON" \
            --build-arg NEXT_PUBLIC_APP_URL="$APP" \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            -t marley-ops-staging:latest .
      - name: Restart staging + health-check (auto-rollback on failure)
        run: |
          set -euo pipefail
          health() {
            for i in $(seq 1 12); do
              sleep 3
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/login || true)
              echo "staging login -> $code"
              if [ "$code" = "200" ]; then return 0; fi
            done
            return 1
          }
          start() {
            sudo docker rm -f marley-ops-staging 2>/dev/null || true
            sudo docker run -d --name marley-ops-staging --restart unless-stopped \
              --network rbs -p 127.0.0.1:3001:3000 --env-file /opt/marley-ops-staging/app.env "$1"
          }
          start marley-ops-staging:latest
          if health; then echo "healthy"; exit 0; fi
          echo "staging did not become healthy"; sudo docker logs --tail 40 marley-ops-staging
          if sudo docker image inspect marley-ops-staging:prev >/dev/null 2>&1; then
            echo "ROLLING BACK to previous image"
            start marley-ops-staging:prev
            health && echo "rollback healthy" || echo "rollback ALSO unhealthy - manual intervention needed"
          fi
          exit 1
      - name: Prune old images
        if: always()
        run: sudo docker image prune -f >/dev/null 2>&1 || true

  e2e:
    needs: [changes, deploy-staging]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The seed/create-users scripts talk to the staging DB directly; the specs
      # sign in through the live staging app at E2E_BASE_URL. Zoho points at the
      # STAGING org (Demo Removals) — a separate account that physically can't
      # reach Connor's live books — so the money/Zoho specs run and assert against
      # the staging invoices. Card PANs (E2E_CARD_*) stay unset, so the card P0s
      # remain fixme'd. See docs/staging-and-ci.md.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: https://staging.ops.marleymoves.co.uk
      E2E_OFFICE_PASSWORD: ${{ secrets.E2E_OFFICE_PASSWORD }}
      E2E_ESTIMATOR_PASSWORD: ${{ secrets.E2E_ESTIMATOR_PASSWORD }}
      E2E_CREW_PASSWORD: ${{ secrets.E2E_CREW_PASSWORD }}
      ZOHO_ORG_ID: ${{ secrets.STAGING_ZOHO_ORG_ID }}
      ZOHO_CLIENT_ID: ${{ secrets.STAGING_ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.STAGING_ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.STAGING_ZOHO_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision e2e users on staging
        env:
          E2E_USERS_CONFIRM: "yes"
        run: node scripts/create-e2e-users.mjs
      - name: Seed staging DB
        env:
          SEED_CONFIRM: "yes"
          SEED_REMOTE_CONFIRM: "yes"
        run: node scripts/seed-e2e.mjs
      - name: Playwright e2e against the live staging deployment
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e/artefacts/report
          retention-days: 7
