name: CI + Deploy to OVH

# Push to master → run the test gate on a GitHub-hosted runner, then (only if green)
# build + restart the app on the self-hosted runner that lives on the OVH VPS.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # timeout-minutes on every job: a hung step otherwise holds the deploy-ovh
    # concurrency group for GitHub's 6-hour default (same failure shape as the
    # 2026-08-19 staging e2e hang). The `deploy` job's approval wait does not
    # count — the clock starts when the job starts running.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    # No manual gate. The required reviewer on the `Production` environment was
    # removed 2026-08-21: it prompted at the moment with the LEAST information —
    # after lint, tsc, vitest, build and the full staging e2e had already passed —
    # so the click re-confirmed a decision the gates had made, 18 times. The real
    # safety net is the post-deploy health check below, which hits the running
    # container and rolls back to `marley-ops:prev` on failure, and which runs
    # whether or not a human is watching. The environment itself is kept (no
    # secrets are scoped to it) so deployment history and the activity log stay
    # intact. Re-arm by adding a required reviewer in repo Settings > Environments.
    # Promotion policy: only merge to master once the staging `e2e` check passed.
    environment: production
    runs-on: [self-hosted, ovh]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image (NEXT_PUBLIC_* baked from the box env)
        run: |
          set -euo pipefail
          # Keep the currently-running image as the rollback target.
          sudo docker tag marley-ops:latest marley-ops:prev 2>/dev/null || true
          URL=$(sudo grep '^NEXT_PUBLIC_SUPABASE_URL=' /opt/marley-ops/app.env | cut -d= -f2-)
          ANON=$(sudo grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' /opt/marley-ops/app.env | cut -d= -f2-)
          APP=$(sudo grep '^NEXT_PUBLIC_APP_URL=' /opt/marley-ops/app.env | cut -d= -f2-)
          sudo docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON" \
            --build-arg NEXT_PUBLIC_APP_URL="$APP" \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            -t marley-ops:latest .
      - name: Restart + health-check (auto-rollback on failure)
        run: |
          set -euo pipefail
          health() {
            for i in $(seq 1 12); do
              sleep 3
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login || true)
              echo "login -> $code"
              if [ "$code" = "200" ]; then return 0; fi
            done
            return 1
          }
          start() {
            sudo docker rm -f marley-ops-app 2>/dev/null || true
            sudo docker run -d --name marley-ops-app --restart unless-stopped \
              --network rbs -p 127.0.0.1:3000:3000 --env-file /opt/marley-ops/app.env "$1"
          }
          start marley-ops:latest
          if health; then echo "healthy"; exit 0; fi
          echo "app did not become healthy"; sudo docker logs --tail 40 marley-ops-app
          if sudo docker image inspect marley-ops:prev >/dev/null 2>&1; then
            echo "ROLLING BACK to previous image"
            start marley-ops:prev
            health && echo "rollback healthy" || echo "rollback ALSO unhealthy - manual intervention needed"
          fi
          exit 1
      - name: Prune old images
        if: always()
        run: sudo docker image prune -f >/dev/null 2>&1 || true
