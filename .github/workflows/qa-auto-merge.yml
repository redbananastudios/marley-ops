name: QA repair auto-merge

# Repair PRs from the QA loop (label `qa-repair`) and Pitmans build gates
# (label `pitmans-gate`, docs/multi-brand-prd.md §5), base `staging`, get the
# full four-gate check ON THE PR — the repo's other workflows only run on push,
# so without this job an auto-merge would land unvalidated. Green → squash-merge
# → explicitly dispatch the staging deploy (a GITHUB_TOKEN merge does not
# trigger push workflows, so without the dispatch the work would never reach
# staging or the e2e suite). Scope: only labelled PRs; everything else is
# untouched. The risky-path guard below applies to BOTH labels unchanged: any
# PR touching schema/money/comms/auth paths fails the gate and sits for Peter.
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    branches: [staging]

concurrency:
  group: qa-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'qa-repair') || contains(github.event.pull_request.labels.*.name, 'pitmans-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The risky-path guard diffs against the base branch.
          fetch-depth: 0
      # Structural enforcement of the risky-class boundary: schema, RLS, money,
      # comms-sending and auth paths must never land without a human, whatever
      # the finding's class says (PR #28 auto-merged a migration under a
      # safe-fix label, 2026-08-20). A hit fails the gate; the PR then sits for
      # a human — exactly the behaviour an unlabelled PR gets.
      #
      # The list is the guard's SCOPE, spelled out as paths — and a path list
      # does not grow itself when the code does. The Pitmans build added a
      # whole second generation of money rails that landed OUTSIDE every
      # pattern here, so a `pitmans-gate` PR touching only those robot-merged
      # unreviewed (third-pass completeness critic, 2026-09-02). Each family
      # below is in the scope the comment above already claims:
      #   lib/ledger/**        raises and voids customer invoices
      #   lib/bank-feed/**     decides which customer payments are explained
      #   lib/payments-policy  decides what we ASK a customer to pay — the
      #                        `lib/payments/**` folder pattern never matched
      #                        this file, which sits at lib/ root
      #   raise-storage-inv    raises storage invoices AND emails them
      #   quote/accept-flow    raises invoices AND sends customer email
      #   zoho.ts, zoho-access the ledger client, and the alarm that is
      #                        supposed to fire when it breaks
      #   lib/brand.ts         which brand's name, from-address and BANK
      #                        DETAILS a customer is shown
      # Widening a guard only ever costs a human merge; the failure it
      # prevents is a money path landing with nobody reading it.
      - name: Refuse risky paths (human-only)
        run: |
          risky=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- \
            'supabase/migrations/**' \
            'lib/payments/**' \
            'lib/payments-policy.ts' \
            'lib/comms/**' \
            'app/api/card/**' \
            'lib/supabase/proxy-session.ts' \
            'lib/ledger/**' \
            'lib/bank-feed/**' \
            'lib/storage/raise-storage-invoices.ts' \
            'lib/quote/accept-flow.ts' \
            'lib/zoho.ts' \
            'lib/ops/zoho-access.ts' \
            'lib/brand.ts')
          if [ -n "$risky" ]; then
            echo "::error::qa-repair PR touches human-only paths — auto-merge refused:"
            echo "$risky"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  merge:
    needs: gate
    if: contains(github.event.pull_request.labels.*.name, 'qa-repair') || contains(github.event.pull_request.labels.*.name, 'pitmans-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Squash-merge and deploy staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}
          gh workflow run staging.yml --ref staging --repo ${{ github.repository }}
